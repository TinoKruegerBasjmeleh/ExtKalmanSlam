# Mirror ament_cpplint (slam3d-ngp) so the shared robot_tools sources lint
# identically in both repos.
set noparent
linelength=100
root=include
# build/header_guard: ament style uses ROBOT_TOOLS__FILE_HPP_ (double underscore).
filter=-build/c++11,-runtime/references,-whitespace/braces,-whitespace/indent,-whitespace/parens,-whitespace/semicolon,-build/header_guard
